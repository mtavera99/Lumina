<!doctype html>
<html lang="es-PR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>¡Gracias! | Lumina PR</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet" />

  <!-- ============================================================
       PÍXEL DE META + EVENTO "Lead"
       Esta página se abre cuando alguien COMPLETA el formulario,
       así el evento Lead se cuenta solo con conversiones reales.
       Reemplaza 2484699815368533 por el mismo ID de tu píxel.
       (Ver README: configurar el redirect del widget de OpenSolar
        hacia esta página.)
       ============================================================ -->
  <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '2484699815368533');
    fbq('track', 'PageView');
    // Conversión: SOLO se cuenta si llega el event_id que genera el formulario
    // al enviarse (?eid=...). Sin ese id no hubo envio real, asi que no hay Lead.
    //
    // Antes habia un respaldo que disparaba Lead sin id: eso convertia cualquier
    // visita directa a esta pagina (pruebas, rastreadores, un enlace compartido)
    // en una conversion falsa, y ademas ensuciaba la senal con la que Meta
    // optimiza la campana. El envio del formulario es 100% JavaScript, asi que
    // toda conversion legitima trae su eid; exigirlo no pierde ningun lead real.
    (function () {
      var eid = new URLSearchParams(window.location.search).get('eid');
      if (eid) fbq('track', 'Lead', {}, { eventID: eid });
    })();
  </script>
  <!-- ============================================================ -->

  <style>

    <p>Un asesor de Lumina te contactará muy pronto para tu evaluación solar gratuita. Mientras tanto, prepara tu factura de luz más reciente para agilizar el proceso.</p>
